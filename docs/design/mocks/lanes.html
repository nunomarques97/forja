<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forja · Lanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Direction A — Lanes. Time runs left to right; each project is a lane,
     the reviewer subagent gets its own sub-lane under the session that called it. */
  :root {
    --bg: #F7F8FA; --surface: #FFFFFF; --ink: #151C26; --muted: #5E6978; --rule: #E2E6EC;
    --main: #2B63D9; --sub: #B8520F;
    --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
  .page { max-width: 1360px; margin: 0 auto; padding: var(--s5) var(--s6) var(--s7); }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2) var(--s5); margin-bottom: var(--s5); }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font: 12px var(--mono); }
  .tabs { margin-left: auto; display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .tabs button { font: 500 13px var(--sans); border: 0; background: none; padding: 6px 14px; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
  button:focus-visible, .row:focus-visible { outline: 2px solid var(--main); outline-offset: 2px; }

  .legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); color: var(--muted); font-size: 12px; margin-bottom: var(--s3); }
  .legend i { display: inline-block; vertical-align: -1px; margin-right: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .span { width: 22px; height: 8px; border-radius: 2px; border: 1.5px solid var(--main); background: color-mix(in srgb, var(--main) 18%, transparent); }

  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
  .chart-scroll { overflow-x: auto; padding: var(--s4) var(--s4) var(--s2); }
  svg text { font-family: var(--sans); }
  .lane-name { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .lane-sub { font: 11px var(--mono); fill: var(--muted); }
  .tick { font: 11px var(--mono); fill: var(--muted); }
  .ev { cursor: pointer; }
  .ev:hover circle, .ev.sel circle { stroke: var(--ink); stroke-width: 2; }

  .below { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--s4); margin-top: var(--s4); }
  .panel h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--rule); }
  .detail { padding: var(--s4); }
  .detail .who { display: flex; align-items: center; gap: var(--s2); font-size: 12px; color: var(--muted); }
  .detail .what { font-size: 16px; font-weight: 500; margin: var(--s2) 0 var(--s3); overflow-wrap: anywhere; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px var(--s4); font: 12px var(--mono); }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .link { font: 500 13px var(--sans); color: var(--main); background: none; border: 0; padding: 0; margin-top: var(--s3); cursor: pointer; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 64px 3px 132px minmax(0,1fr) auto; gap: var(--s3); align-items: center; padding: 7px var(--s4); border-bottom: 1px solid var(--rule); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--bg); }
  .row .t { font: 12px var(--mono); color: var(--muted); }
  .row .rail { align-self: stretch; border-radius: 2px; }
  .row .tool { font: 500 12px var(--mono); }
  .row .sum { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .proj { font-size: 12px; color: var(--muted); }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 320px; z-index: 5; display: none; }

  /* raw table: same columns and behaviour as the current viewer */
  .raw-wrap { overflow-x: auto; }
  table.raw { border-collapse: collapse; font: 12px var(--mono); width: 100%; }
  table.raw th, table.raw td { border: 1px solid var(--rule); padding: 3px 6px; text-align: left; vertical-align: top; white-space: nowrap; }
  table.raw th { background: var(--bg); position: sticky; top: 0; }
  table.raw td.input { white-space: normal; min-width: 320px; word-break: break-all; }
  table.raw td.num { cursor: pointer; color: var(--main); }
  table.raw pre { margin: 4px 0; white-space: pre-wrap; word-break: break-all; }
  table.raw tr.flash td { background: #FFF4CC; }
  body[data-view="raw"] #visual, body[data-view="visual"] #raw { display: none; }

  @media (max-width: 720px) {
    .page { padding: var(--s4) var(--s4) var(--s6); }
    .tabs { margin-left: 0; }
    .below { grid-template-columns: 1fr; }
    .row { grid-template-columns: 58px 3px 1fr; }
    .row .sum { grid-column: 3; } .row .proj { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Forja activity</h1>
    <span class="meta" id="meta">loading data/events.jsonl…</span>
    <div class="tabs" role="tablist">
      <button data-tab="visual" role="tab">Timeline</button>
      <button data-tab="raw" role="tab">Raw table</button>
    </div>
  </header>

  <section id="visual">
    <div class="legend">
      <span><i class="dot" style="background:var(--main)"></i>Main session tool call</span>
      <span><i class="dot" style="background:var(--sub)"></i>Reviewer subagent tool call</span>
      <span><i class="span"></i>Agent call, main session waiting on the subagent</span>
      <span>Idle gaps over 90 s are collapsed</span>
    </div>
    <div class="card"><div class="chart-scroll" id="chart"></div></div>
    <div class="below">
      <div class="card panel"><h2>Selected event</h2><div class="detail" id="detail"></div></div>
      <div class="card panel"><h2>Latest first</h2><ul class="rows" id="feed"></ul></div>
    </div>
  </section>
  <section id="raw" class="card"></section>
</div>
<div class="tip" id="tip"></div>

<script type="module">
import { loadEvents, model, summarize, timeScale, t0, fmtTime, fmtDur, renderRawTable, wireTabs, esc } from './shared.js';

const events = await loadEvents();
const M = model(events);
renderRawTable(document.getElementById('raw'), events);
wireTabs();

const color = rec => rec.agent_type ? 'var(--sub)' : 'var(--main)';
document.getElementById('meta').textContent =
  `snapshot of data/events.jsonl · ${M.ok.length} events · ${M.projects.length} projects · ${fmtTime(M.first)}–${fmtTime(M.last)}`;

// ---- chart
const host = document.getElementById('chart');
const GUT = 180, W = Math.max(960, host.clientWidth - 32), PLOT = W - GUT - 16;
const x = timeScale(M.ok.map(e => t0(e.rec)), PLOT);
const lanes = [];
for (const p of M.projects) {
  lanes.push({ kind: 'main', p });
  const subs = [...new Set(p.events.filter(e => e.rec.agent_type).map(e => `${e.rec.agent_type}|${e.rec.agent_id}`))];
  for (const s of subs) lanes.push({ kind: 'sub', p, key: s });
}
const LANE_H = 46, TOP = 40, H = TOP + lanes.length * LANE_H + 12;
const y = i => TOP + i * LANE_H + LANE_H / 2;
let svg = `<svg width="${W}" height="${H}" role="img" aria-label="Tool events over time by project">`;

// time axis: one label at the start and end of each active stretch, break marks between
x.segments.forEach((g, i) => {
  svg += `<text class="tick" x="${GUT + g.x0}" y="14">${fmtTime(g.a + 4000)}</text>`;
  if (g.x1 - g.x0 > 120) svg += `<text class="tick" x="${GUT + g.x1}" y="14" text-anchor="end">${fmtTime(g.b - 4000)}</text>`;
  svg += `<rect x="${GUT + g.x0}" y="${TOP - 8}" width="${g.x1 - g.x0}" height="${H - TOP}" fill="#F2F4F7" rx="4"/>`;
  const next = x.segments[i + 1];
  if (next) {
    const mid = GUT + (g.x1 + next.x0) / 2, mins = Math.round((next.a - g.b) / 60000);
    svg += `<path d="M${mid - 4} ${TOP - 8} l8 ${(H - TOP) / 2} l-8 ${(H - TOP) / 2}" stroke="#C9D0DA" fill="none" stroke-dasharray="3 3"/>`;
    svg += `<text class="tick" x="${mid}" y="30" text-anchor="middle">${mins} min</text>`;
  }
});

lanes.forEach((l, i) => {
  const yy = y(i);
  if (i > 0 && l.kind === 'main') svg += `<line x1="0" x2="${W}" y1="${yy - LANE_H / 2}" y2="${yy - LANE_H / 2}" stroke="var(--rule)"/>`;
  if (l.kind === 'main') {
    svg += `<text class="lane-name" x="0" y="${yy - 2}">${esc(l.p.name)}</text>`;
    svg += `<text class="lane-sub" x="0" y="${yy + 13}">main session · ${l.p.events.filter(e => !e.rec.agent_type).length} calls</text>`;
  } else {
    const [type, id] = l.key.split('|');
    svg += `<text class="lane-name" x="14" y="${yy - 2}" style="fill:var(--sub)">↳ ${esc(type)}</text>`;
    svg += `<text class="lane-sub" x="14" y="${yy + 13}">agent ${esc(id.slice(0, 8))}…</text>`;
  }
  svg += `<line x1="${GUT}" x2="${W - 16}" y1="${yy}" y2="${yy}" stroke="#D5DAE2"/>`;
});

// handoffs: span on the caller's lane, dashed drops to the subagent lane
for (const h of M.handoffs) {
  const li = lanes.findIndex(l => l.kind === 'main' && l.p.name === h.project);
  const si = lanes.findIndex(l => l.kind === 'sub' && l.key === `${h.agentType}|${h.agentId}`);
  const x0 = GUT + x(h.start), x1 = GUT + x(h.end), ym = y(li);
  svg += `<rect x="${x0}" y="${ym - 7}" width="${x1 - x0}" height="14" rx="3" fill="color-mix(in srgb, var(--main) 14%, transparent)" stroke="var(--main)" stroke-width="1.5"/>`;
  svg += `<text x="${(x0 + x1) / 2}" y="${ym - 13}" text-anchor="middle" style="font-size:12px;font-weight:500;fill:var(--ink)">${esc(summarize(h.call.rec))} · ${fmtDur(h.end - h.start)}</text>`;
  if (si >= 0) {
    const ys = y(si);
    svg += `<path d="M${x0} ${ym + 7} V${ys}" stroke="var(--sub)" stroke-dasharray="3 3" fill="none"/>`;
    if (h.handback) {
      const xb = GUT + x(t0(h.handback.rec));
      svg += `<path d="M${xb} ${ys} C${xb} ${ym + 20}, ${x1} ${ys - 10}, ${x1} ${ym + 7}" stroke="var(--sub)" fill="none" stroke-width="1.5"/>`;
      if (h.verdict) svg += `<g><rect x="${xb + 10}" y="${ys + 8}" width="${h.verdict.length * 8 + 16}" height="20" rx="10" fill="var(--surface)" stroke="var(--sub)"/><text x="${xb + 18}" y="${ys + 22}" style="font:600 11px var(--mono);fill:var(--ink)">${esc(h.verdict)}</text></g>`;
    }
  }
}

for (const e of M.ok) {
  const li = e.rec.agent_type
    ? lanes.findIndex(l => l.kind === 'sub' && l.key === `${e.rec.agent_type}|${e.rec.agent_id}`)
    : lanes.findIndex(l => l.kind === 'main' && l.p.name === (e.rec.project || '(none)'));
  const cx = GUT + x(t0(e.rec)), cy = y(li);
  const isBack = e.rec.tool_name === 'SubagentHandback';
  svg += `<g class="ev" data-line="${e.line}">
    <circle cx="${cx}" cy="${cy}" r="14" fill="transparent"/>
    ${isBack
      ? `<rect x="${cx - 6}" y="${cy - 6}" width="12" height="12" transform="rotate(45 ${cx} ${cy})" fill="${color(e.rec)}" stroke="var(--surface)" stroke-width="2"/>`
      : `<circle cx="${cx}" cy="${cy}" r="6" fill="${color(e.rec)}" stroke="var(--surface)" stroke-width="2"/>`}
  </g>`;
}
svg += '</svg>';
host.innerHTML = svg;

// ---- detail + feed
const byLine = new Map(M.ok.map(e => [String(e.line), e]));
const detail = document.getElementById('detail');
function select(line) {
  const e = byLine.get(String(line));
  host.querySelectorAll('.ev').forEach(g => g.classList.toggle('sel', g.dataset.line === String(line)));
  const r = e.rec;
  detail.innerHTML = `
    <div class="who"><i class="dot" style="background:${color(r)}"></i>${esc(r.project)} · ${r.agent_type ? `${esc(r.agent_type)} subagent` : 'main session'} · ${fmtTime(t0(r))}</div>
    <div class="what"><span style="font-family:var(--mono)">${esc(r.tool_name)}</span> — ${esc(summarize(r))}</div>
    <dl class="kv">
      <dt>line</dt><dd>${e.line}</dd>
      <dt>hook</dt><dd>${esc(r.hook_event_name)}</dd>
      <dt>duration</dt><dd>${fmtDur(r.duration_ms ?? 0)}</dd>
      <dt>session</dt><dd>${esc(r.session_id)}</dd>
      ${r.agent_id ? `<dt>agent_id</dt><dd>${esc(r.agent_id)}</dd>` : ''}
      <dt>mode</dt><dd>${esc(r.permission_mode)}</dd>
    </dl>
    <button class="link" onclick="jumpToRaw(${e.line})">Open line ${e.line} in raw table →</button>`;
}
host.addEventListener('click', ev => { const g = ev.target.closest('.ev'); if (g) select(g.dataset.line); });
const tip = document.getElementById('tip');
host.addEventListener('mousemove', ev => {
  const g = ev.target.closest('.ev');
  if (!g) { tip.style.display = 'none'; return; }
  const r = byLine.get(g.dataset.line).rec;
  tip.innerHTML = `<b>${esc(r.tool_name)}</b> · ${fmtTime(t0(r))}<br>${esc(summarize(r))}`;
  Object.assign(tip.style, { display: 'block', left: ev.clientX + 12 + 'px', top: ev.clientY + 12 + 'px' });
});

document.getElementById('feed').innerHTML = [...M.ok].reverse().slice(0, 9).map(e => `
  <li class="row" tabindex="0" onclick="jumpToRaw(${e.line})">
    <span class="t">${fmtTime(t0(e.rec))}</span>
    <span class="rail" style="background:${color(e.rec)}"></span>
    <span class="tool">${esc(e.rec.tool_name)}</span>
    <span class="sum">${esc(summarize(e.rec))}</span>
    <span class="proj">${esc(e.rec.project)}</span>
  </li>`).join('');

select((M.handoffs[0]?.handback || M.ok[M.ok.length - 1]).line);
</script>
</body>
</html>
