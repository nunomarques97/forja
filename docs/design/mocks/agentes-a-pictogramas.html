<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cena — agentes ligados · direção A: Pictogramas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="agentes-base.css">
<style>
  /* ---- direção A: pictogramas numa placa de ligações ----
     Figuras geométricas simples (placas rectangulares com o monograma),
     arestas ortogonais com pinos no Lead, cruzamentos desenhados como
     passagens por baixo. Mantém as cinco colunas do HUD: cada nó fica
     exatamente por cima do seu cartão. */
  .edge{fill:none;stroke-linejoin:round;stroke-linecap:round}
  .edge.hub{stroke:#6A5A4C;stroke-width:1.6}
  .edge.flow{stroke:#4A3E35;stroke-width:1.6;stroke-dasharray:5 5}
  .edge.under{stroke:var(--bg);stroke-width:5.5;stroke-dasharray:none}
  .cold .edge.hub{stroke:#3A3128} .cold .edge.flow{stroke:#2E2720}
  .tile{fill:var(--surface);stroke:var(--c);stroke-width:1.5}
  .tile.demand{stroke-dasharray:6 4}
  .mono{font:700 21px/1 var(--hud);letter-spacing:.04em;fill:var(--c);text-anchor:middle}
  .mono.sm{font-size:16px}
  .pin{fill:#6A5A4C}
  .notch{fill:var(--c)}
  @media (prefers-reduced-motion:no-preference){
    .node.live .halo{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    .hb{animation:hb 1.7s ease-in-out infinite}
    .hb2{animation-delay:.3s} .hb3{animation-delay:.6s}
    @keyframes hb{0%,100%{opacity:.05}45%{opacity:1}}
  }
  .hb{opacity:.85}
  .mobile{display:none}
  @media (max-width:720px){
    .desktop{display:none} .mobile{display:block}
    .fold{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin:var(--s2) var(--s4) 0;
          padding:var(--s2) var(--s3);background:var(--surface);border:1px solid var(--line);
          border-radius:8px;min-height:44px}
    .fold b{font:700 14px/1 var(--hud);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
    .pill{display:inline-flex;align-items:center;gap:5px;font:400 12px/1 var(--mono);
          border:1px solid var(--line);border-radius:4px;padding:6px 6px 5px}
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { ROLES, EDGES, byKey, scenario, esc, glyph, glyphOf, glowOpacity, glowColour, bodyOpacity, isLive, toneOf } from './agentes-dados.js';
import { renderHeader, renderHud, renderLegend } from './agentes-chrome.js';

const sc = scenario();
const M = new Map(sc.members.map(m => [m.key, m]));

/* ---------- geometria desktop: as cinco colunas do HUD, duas filas ---------- */
const W = 1440, H = 240;
const PAD = 24, GAP = 8, COLS = 5;
const COL = (W - 2 * PAD - (COLS - 1) * GAP) / COLS;      // 272
const cx = i => PAD + i * (COL + GAP) + COL / 2;          // 160 440 720 1000 1280
const FRONT = { y: 176, w: 92, h: 54 }, BACK = { y: 62, w: 72, h: 40 };
const colOf = k => ROLES.filter(r => r.core === byKey(k).core).findIndex(r => r.key === k);
function geoD(k) {
  const core = byKey(k).core, r = core ? FRONT : BACK;
  return box(cx(colOf(k)), r.y, r.w, r.h, core);
}
const box = (x, y, w, h, core) => ({ x, y, w, h, core, top: y - h / 2, bot: y + h / 2, left: x - w / 2, right: x + w / 2 });

/* ---------- geometria telemóvel: só o núcleo, 390 de largura ---------- */
const MW = 390, MH = 196;
const MOB = {
  'lead':         box(195, 40, 92, 40, true),
  'architect':    box(64, 118, 76, 36, true),
  'frontend-dev': box(195, 118, 76, 36, true),
  'backend-dev':  box(326, 118, 76, 36, true),
  'reviewer':     box(195, 178, 76, 32, true),
};
const geoM = k => MOB[k];

/* ---------- arestas ----------
   `hub` (o Lead chama mesmo): pino no topo da placa do Lead → corredor
   próprio → entrada no alvo; por construção não se cruzam.
   `flow` (representação do fluxo de trabalho, não uma chamada real):
   tracejado entre placas vizinhas, com os saltos longos pelo corredor de baixo. */
const HUB_ORDER = ['product-manager', 'product-designer', 'technology-scout', 'qa', 'security-reviewer',
                   'architect', 'frontend-dev', 'backend-dev', 'reviewer'];
function hubPathD(k) {
  const i = HUB_ORDER.indexOf(k), back = i < 5;
  const pinX = back ? 118 + i * 10 : 168 + (i - 5) * 10;
  const lane = back ? 88 + i * 6 : 122 + (i - 5) * 6;
  const g = geoD(k), leadTop = FRONT.y - FRONT.h / 2;
  return { d: `M ${pinX} ${leadTop} V ${lane} H ${g.x} V ${back ? g.bot : g.top}`, pinX, pinY: leadTop };
}
const FLOW_D = {
  'architect>frontend-dev':      () => side('architect', 'frontend-dev'),
  'backend-dev>reviewer':        () => side('backend-dev', 'reviewer'),
  'architect>backend-dev':       () => under('architect', 'backend-dev', 216),
  'frontend-dev>reviewer':       () => under('frontend-dev', 'reviewer', 230),
  'qa>lead':                     () => { const q = geoD('qa'), l = geoD('lead'); return `M ${q.x} ${q.top} V 22 H 88 V 166 H ${l.left}`; },
  'reviewer>security-reviewer':  () => { const r = geoD('reviewer'), s = geoD('security-reviewer'); return `M ${r.x + 16} ${r.top} V ${s.bot}`; },
  'product-manager>architect':   () => elbow('product-manager', 'architect'),
  'product-designer>frontend-dev': () => elbow('product-designer', 'frontend-dev'),
  'technology-scout>frontend-dev': () => { const t = geoD('technology-scout'), f = geoD('frontend-dev'); return `M ${t.x - 16} ${t.bot} V ${f.top}`; },
  'technology-scout>backend-dev':  () => elbow('technology-scout', 'backend-dev'),
};
const side = (a, b, G = geoD) => { const A = G(a), B = G(b); return `M ${A.right} ${A.y} H ${B.left}`; };
const under = (a, b, lane, G = geoD) => { const A = G(a), B = G(b); return `M ${A.x} ${A.bot} V ${lane} H ${B.x} V ${B.bot}`; };
// cotovelo de trás para a frente: sobe do lado direito do nó de trás e entra pelo topo esquerdo do da frente
const elbow = (a, b, G = geoD) => { const A = G(a), B = G(b); return `M ${A.right} ${A.y + 4} H ${B.left - 14} V ${B.top - 8} H ${B.left + 10} V ${B.top}`; };

const FLOW_M = {
  'architect>frontend-dev': () => side('architect', 'frontend-dev', geoM),
  'architect>backend-dev':  () => under('architect', 'backend-dev', 156, geoM),
  'frontend-dev>reviewer':  () => { const f = geoM('frontend-dev'), r = geoM('reviewer'); return `M ${f.x} ${f.bot} V ${r.top}`; },
  'backend-dev>reviewer':   () => { const b = geoM('backend-dev'), r = geoM('reviewer'); return `M ${b.x} ${b.bot} V 166 H ${r.right}`; },
  'qa>lead': () => '',
};
function hubPathM(k) {
  const g = geoM(k), l = geoM('lead');
  const i = ['architect', 'frontend-dev', 'backend-dev', 'reviewer'].indexOf(k);
  const pinX = l.x - 30 + i * 20;
  if (k === 'frontend-dev') return { d: `M ${pinX} ${l.bot} V ${g.top}`, pinX, pinY: l.bot };
  if (k === 'reviewer') return { d: `M ${pinX} ${l.bot} V 96 H ${l.right + 34} V ${g.y} H ${g.right}`, pinX, pinY: l.bot };
  return { d: `M ${pinX} ${l.bot} V ${78 + i * 4} H ${g.x} V ${g.top}`, pinX, pinY: l.bot };
}

/* ---------- nós ---------- */
function node(m, G, small) {
  const g = G(m.key);
  const op = bodyOpacity(m), glowOp = glowOpacity(m), gcol = glowColour(m);
  const id = `ha-${m.key}${small ? '-m' : ''}`;
  const halo = glowOp ? `<ellipse class="halo" cx="${g.x}" cy="${g.y}" rx="${g.w * .92}" ry="${g.h * 1.15}" fill="url(#${id})" opacity="${glowOp}"/>` : '';
  const grad = glowOp ? `<radialGradient id="${id}"><stop offset="0" stop-color="${gcol}" stop-opacity=".6"/><stop offset=".5" stop-color="${gcol}" stop-opacity=".2"/><stop offset="1" stop-color="${gcol}" stop-opacity="0"/></radialGradient>` : '';
  const gk = glyphOf(m), gr = g.core ? 8 : 6.5;
  const badge = gk === 'none' ? '' :
    `<g transform="translate(${g.right - gr - 2} ${g.top + gr + 2})"><circle r="${gr + 3.5}" fill="var(--bg)" stroke="var(--line)"/>${glyph(gk, 0, 0, gr)}</g>`;
  const n = Math.min((m.tasks || []).length, 3);
  const notches = [...Array(n)].map((_, j) => `<rect class="notch" x="${g.x - (n * 8 - 3) / 2 + j * 8}" y="${g.bot - 7}" width="5" height="3" rx="1.5"/>`).join('');
  const cross = toneOf(m.state) === 'dead'
    ? `<g stroke="var(--alarm)" stroke-width="3" stroke-linecap="round"><line x1="${g.left + 6}" y1="${g.top + 6}" x2="${g.right - 6}" y2="${g.bot - 6}"/><line x1="${g.right - 6}" y1="${g.top + 6}" x2="${g.left + 6}" y2="${g.bot - 6}"/></g>` : '';
  return { grad, g: `<g class="node m-${m.key} ${isLive(m) ? 'live' : ''}">${halo}
    <g opacity="${op}">
      <rect class="tile ${g.core && !small ? '' : byKey(m.key).core ? '' : 'demand'}" x="${g.left}" y="${g.top}" width="${g.w}" height="${g.h}" rx="6"/>
      <text class="mono ${g.h > 44 ? '' : 'sm'}" x="${g.x}" y="${g.y + (g.h > 44 ? 7 : 5)}">${esc(m.mono)}</text>
      ${notches}
    </g>${badge}${cross}</g>` };
}

/* ---------- cena ---------- */
function scene(keys, G, hubFn, flowMap, vw, vh, small) {
  const set = new Set(keys);
  const edges = EDGES.filter(e => set.has(e.a) && set.has(e.b));
  const hub = edges.filter(e => e.kind === 'hub').map(e => hubFn(e.b));
  const pins = hub.map(h => `<rect class="pin" x="${h.pinX - 2}" y="${h.pinY - 2}" width="4" height="4" rx="1"/>`).join('');
  const hubD = hub.map(h => `<path class="edge hub" d="${h.d}"/>`).join('');
  const flow = edges.filter(e => e.kind === 'flow').map(e => (flowMap[`${e.a}>${e.b}`] || (() => ''))()).filter(Boolean);
  const flowD = flow.map(d => `<path class="edge flow under" d="${d}"/>`).join('')
    + flow.map(d => `<path class="edge flow" d="${d}" marker-end="url(#arw${small ? 'm' : ''})"/>`).join('');
  const hb = sc.runnerAlive ? (sc.handbacks || []).filter(h => set.has(h.a) && set.has(h.b)).map(h => {
    const A = G(h.a), B = G(h.b), lane = small ? 166 : 230;
    return [.3, .5, .7].map((t, j) => `<circle class="hb hb${j + 1}" cx="${A.x + (B.x - A.x) * t}" cy="${lane}" r="3.5" fill="var(--patina)"/>`).join('');
  }).join('') : '';
  const nodes = keys.map(k => node(M.get(k), G, small));
  return `<svg class="scene" viewBox="0 0 ${vw} ${vh}" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Ligações do elenco. ${esc(keys.map(k => `${byKey(k).name}: ${M.get(k).state}`).join('. '))}">
    <defs>${nodes.map(n => n.grad).join('')}
      <marker id="arw${small ? 'm' : ''}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M 0 0 L 8 4 L 0 8 z" fill="#6A5A4C"/></marker></defs>
    ${hubD}${flowD}${hb}${pins}${nodes.map(n => n.g).join('')}
  </svg>`;
}

const all = ROLES.map(r => r.key);
const core = ROLES.filter(r => r.core).map(r => r.key);
const foldRow = `<div class="fold"><b>a pedido</b>${ROLES.filter(r => !r.core).map(r => {
  const m = M.get(r.key);
  return `<span class="pill m-${r.key}" style="color:var(--c)"><svg width="13" height="13" viewBox="-7 -7 14 14" aria-hidden="true">${glyph(glyphOf(m), 0, 0, 6)}</svg>${esc(r.mono)}</span>`;
}).join('')}<span class="pill" style="color:var(--dim)">abrir os 5 ▾</span></div>`;

document.getElementById('app').innerHTML =
  renderHeader(sc, 'direção A · pictogramas') +
  `<div class="stage desktop ${sc.runnerAlive ? '' : 'cold'}">${scene(all, geoD, hubPathD, FLOW_D, W, H, false)}</div>` +
  `<div class="stage mobile ${sc.runnerAlive ? '' : 'cold'}">${scene(core, geoM, hubPathM, FLOW_M, MW, MH, true)}</div>` +
  `<div class="mobile">${foldRow}</div>` +
  renderLegend(`linha cheia = o Lead chama · tracejado = fluxo de trabalho (representação)${sc.runnerAlive ? '' : ' · runner parado: a rede está fria'}`) +
  renderHud(sc);

document.title += ` — ${document.querySelectorAll('.desktop svg *').length} elementos SVG`;
</script>
</body>
</html>
