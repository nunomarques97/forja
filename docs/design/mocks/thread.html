<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forja · Thread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Direction B — Thread. Reads like a session log you can follow top to bottom;
     a handoff to the reviewer is a nested thread that closes with its verdict. */
  :root {
    --bg: #EFF1EE; --surface: #FBFCFA; --ink: #1B211E; --muted: #5D665F; --rule: #DCE0DA;
    --main: #008C7E; --sub: #9B3FB5;
    --sans: 'Figtree', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
  .shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
  aside { border-right: 1px solid var(--rule); padding: var(--s5) var(--s4); }
  .brand { font-weight: 700; font-size: 18px; margin: 0 0 2px; }
  .meta { font: 11px var(--mono); color: var(--muted); margin-bottom: var(--s5); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 var(--s2); }
  .proj { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: var(--s2) var(--s3); margin-bottom: var(--s1); font: inherit; color: inherit; cursor: pointer; }
  .proj[aria-pressed="true"] { background: var(--surface); border-color: var(--rule); }
  .proj .n { display: flex; justify-content: space-between; font-weight: 600; }
  .proj .n span { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
  .proj .split { display: flex; gap: 2px; height: 6px; margin: 6px 0 4px; }
  .proj .split i { border-radius: 3px; }
  .proj .s { font-size: 12px; color: var(--muted); }
  .key { margin-top: var(--s5); font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
  .key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }

  main { padding: var(--s5) var(--s6) var(--s7); min-width: 0; }
  .top { display: flex; align-items: center; gap: var(--s4); margin-bottom: var(--s4); max-width: 920px; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .tabs { margin-left: auto; display: flex; gap: 2px; background: var(--rule); padding: 2px; border-radius: 8px; }
  .tabs button { font: 600 13px var(--sans); border: 0; background: none; padding: 5px 12px; border-radius: 6px; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); }
  button:focus-visible, .ev:focus-visible { outline: 2px solid var(--main); outline-offset: 2px; }

  .feed { max-width: 920px; }
  .session { font-size: 13px; color: var(--muted); margin: var(--s5) 0 var(--s2); display: flex; flex-wrap: wrap; gap: 4px var(--s3); }
  .session b { color: var(--ink); font-weight: 600; }
  .session code { font: 12px var(--mono); }
  .gap { display: flex; align-items: center; gap: var(--s3); color: var(--muted); font-size: 12px; margin: var(--s4) 0; }
  .gap::before, .gap::after { content: ""; flex: 1; border-top: 1px dashed #BFC6BD; }
  .ev { display: grid; grid-template-columns: 70px 92px minmax(0, 1fr) 64px; gap: var(--s3); align-items: baseline; padding: 6px var(--s3); border-radius: 6px; cursor: pointer; }
  .ev:hover { background: var(--surface); }
  .ev .t, .ev .d { font: 12px var(--mono); color: var(--muted); }
  .ev .d { text-align: right; }
  .chip { font: 500 12px var(--mono); padding: 1px 7px; border-radius: 4px; background: color-mix(in srgb, var(--c) 12%, transparent); color: var(--ink); border-left: 3px solid var(--c); justify-self: start; }
  .ev .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .handoff { margin: var(--s2) 0 var(--s2) 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .handoff .hd { display: grid; grid-template-columns: 70px 1fr auto; gap: var(--s3); align-items: baseline; padding: var(--s3); border-bottom: 1px solid var(--rule); }
  .handoff .hd .t { font: 12px var(--mono); color: var(--muted); }
  .handoff .title { font-weight: 600; }
  .handoff .title small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .handoff .stat { font: 12px var(--mono); color: var(--muted); text-align: right; }
  .nest { position: relative; padding: var(--s2) 0 var(--s2) var(--s5); }
  .nest::before { content: ""; position: absolute; left: 44px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--sub); }
  .nest .ev { padding-left: var(--s6); }
  .verdict { display: grid; grid-template-columns: 70px 1fr; gap: var(--s3); padding: var(--s3); background: color-mix(in srgb, var(--sub) 7%, var(--surface)); border-top: 1px solid var(--rule); }
  .verdict > div { min-width: 0; overflow-wrap: anywhere; }
  .verdict .t { font: 12px var(--mono); color: var(--muted); }
  .verdict .v { font-weight: 700; letter-spacing: .02em; }
  .verdict .v span { font: 500 11px var(--mono); padding: 2px 8px; border-radius: 99px; border: 1.5px solid var(--sub); margin-right: 8px; }
  .verdict p { margin: 4px 0 0; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .raw-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
  table.raw { border-collapse: collapse; font: 12px var(--mono); width: 100%; }
  table.raw th, table.raw td { border: 1px solid var(--rule); padding: 3px 6px; text-align: left; vertical-align: top; white-space: nowrap; }
  table.raw th { background: var(--bg); position: sticky; top: 0; }
  table.raw td.input { white-space: normal; min-width: 320px; word-break: break-all; }
  table.raw td.num { cursor: pointer; color: var(--main); }
  table.raw pre { margin: 4px 0; white-space: pre-wrap; word-break: break-all; }
  table.raw tr.flash td { background: #FFF4CC; }
  body[data-view="raw"] #visual, body[data-view="visual"] #raw { display: none; }

  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; min-height: 0; align-content: start; }
    aside { border-right: 0; border-bottom: 1px solid var(--rule); padding: var(--s4); }
    .meta { margin-bottom: var(--s3); }
    #projects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s1); }
    .proj { padding: 6px 8px; margin: 0; } .proj .s { display: none; }
    .key { display: none; }
    main { padding: var(--s4); }
    .top h1 { font-size: 18px; }
    .ev { grid-template-columns: 58px minmax(0, 1fr); row-gap: 2px; }
    .ev .chip { grid-column: 2; } .ev .sum { grid-column: 2; white-space: normal; } .ev .d { display: none; }
    .nest { padding-left: var(--s3); } .nest::before { left: 8px; } .nest .ev { padding-left: var(--s4); }
    .handoff .hd { grid-template-columns: 1fr; gap: 2px; } .handoff .stat { text-align: left; }
    .verdict { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <p class="brand">Forja</p>
    <div class="meta" id="meta">loading…</div>
    <p class="label">Projects</p>
    <div id="projects"></div>
    <div class="key">
      <span><i style="background:var(--main)"></i>Main session</span>
      <span><i style="background:var(--sub)"></i>Reviewer subagent</span>
    </div>
  </aside>
  <main>
    <div class="top">
      <h1 id="heading">All activity</h1>
      <div class="tabs" role="tablist">
        <button data-tab="visual" role="tab">Thread</button>
        <button data-tab="raw" role="tab">Raw table</button>
      </div>
    </div>
    <section id="visual" class="feed"></section>
    <section id="raw"></section>
  </main>
</div>
<script type="module">
import { loadEvents, model, summarize, t0, fmtTime, fmtDur, renderRawTable, wireTabs, esc } from './shared.js';

const events = await loadEvents();
const M = model(events);
renderRawTable(document.getElementById('raw'), events);
wireTabs();
document.getElementById('meta').textContent = `data/events.jsonl · ${M.ok.length} events`;

let current = '';
function renderProjects() {
  const all = { name: '', events: M.ok, sessions: new Set(M.ok.map(e => e.rec.session_id)) };
  document.getElementById('projects').innerHTML = [all, ...M.projects].map(p => {
    const sub = p.events.filter(e => e.rec.agent_type).length, main = p.events.length - sub;
    const last = Math.max(...p.events.map(e => t0(e.rec)));
    return `<button class="proj" aria-pressed="${p.name === current}" data-p="${esc(p.name)}">
      <div class="n">${p.name ? esc(p.name) : 'All projects'} <span>${p.events.length}</span></div>
      <div class="split"><i style="flex:${main};background:var(--main)"></i>${sub ? `<i style="flex:${sub};background:var(--sub)"></i>` : ''}</div>
      <div class="s">${main} main · ${sub} reviewer · last ${fmtTime(last)}</div>
    </button>`;
  }).join('');
  document.querySelectorAll('.proj').forEach(b => b.onclick = () => { current = b.dataset.p; renderProjects(); renderFeed(); });
}

const row = (e, c) => `<div class="ev" tabindex="0" onclick="jumpToRaw(${e.line})" title="Open line ${e.line} in raw table">
  <span class="t">${fmtTime(t0(e.rec))}</span>
  <span class="chip" style="--c:${c}">${esc(e.rec.tool_name)}</span>
  <span class="sum">${esc(summarize(e.rec))}</span>
  <span class="d">${fmtDur(e.rec.duration_ms ?? 0)}</span>
</div>`;

function renderFeed() {
  const evs = M.ok.filter(e => !current || e.rec.project === current);
  document.getElementById('heading').textContent = current ? current : 'All activity';
  // Items in reading order. An Agent call is placed at the moment it STARTED
  // (ts − duration_ms) so the reviewer's calls nest under it; subagent events are
  // then rendered inside it, not in the main list.
  const inHandoff = new Set();
  const items = [];
  for (const h of M.handoffs.filter(h => !current || h.project === current)) {
    h.events.forEach(e => inHandoff.add(e));
    inHandoff.add(h.call);
    items.push({ at: h.start, h, project: h.project, session: h.call.rec.session_id });
  }
  for (const e of evs) if (!inHandoff.has(e)) items.push({ at: t0(e.rec), e, project: e.rec.project, session: e.rec.session_id });
  items.sort((a, b) => a.at - b.at);

  let html = '', prevKey = '', prevAt = null;
  for (const it of items) {
    const key = `${it.project}|${it.session}`;
    if (prevAt !== null && it.at - prevAt > 90_000) html += `<div class="gap">${Math.round((it.at - prevAt) / 60000)} min with no events</div>`;
    if (key !== prevKey) {
      const perm = (it.e || it.h.call).rec.permission_mode;
      html += `<div class="session"><b>${esc(it.project)}</b><span>session <code>${esc(it.session.slice(0, 8))}</code></span><span>mode ${esc(perm)}</span></div>`;
      prevKey = key;
    }
    if (it.e) { html += row(it.e, 'var(--main)'); prevAt = it.at; continue; }
    const h = it.h;
    html += `<div class="handoff">
      <div class="hd">
        <span class="t">${fmtTime(h.start)}</span>
        <span class="title">Handed off to ${esc(h.agentType || 'subagent')}<small>${esc(summarize(h.call.rec))}</small></span>
        <span class="stat">${h.events.length} calls · ${fmtDur(h.end - h.start)}</span>
      </div>
      <div class="nest">${h.events.filter(e => e !== h.handback).map(e => row(e, 'var(--sub)')).join('')}</div>
      ${h.handback ? `<div class="verdict" onclick="jumpToRaw(${h.handback.line})" style="cursor:pointer">
        <span class="t">${fmtTime(t0(h.handback.rec))}</span>
        <div><div class="v">${h.verdict ? `<span>${esc(h.verdict)}</span>` : ''}Handed back to main session at ${fmtTime(h.end)}</div>
        <p>${esc(String(h.handback.rec.tool_input.message).replace(/^\s*[A-Z_]+\s*[—-]\s*/, ''))}</p></div>
      </div>` : ''}
    </div>`;
    prevAt = h.end;
  }
  document.getElementById('visual').innerHTML = html;
}
renderProjects();
renderFeed();
</script>
</body>
</html>
