<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forja · Oficina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Direção B — Oficina. Espetáculo: uma cena de forja a toda a largura (2.5D em
     SVG) em que cada membro é uma estação cuja luz codifica o estado; um HUD com
     o texto exato por baixo de cada estação. O HUD sozinho passa o teste dos
     5 segundos (?scene=0 esconde a cena). */
  :root {
    --bg: #0E0C0B; --panel: #151211; --panel-2: #1B1715; --rule: #3A2F28; --rule-soft: #262019;
    --ink: #F3EBE2; --muted: #A99C8E; --dim: #918679;
    --brasa: #FF7A2F; --madeira: #CFA063; --indigo: #93A0FF; --patina: #63C9A9; --alarme: #FF4F3E; --ambar: #F0B23F;
    --hud: 'Barlow Condensed', 'Arial Narrow', sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--mono); }
  :focus-visible { outline: 2px solid var(--brasa); outline-offset: 2px; }
  .m-ferreiro { --c: var(--brasa); } .m-bigorna { --c: var(--madeira); } .m-fundidor { --c: var(--indigo); } .m-lapidador { --c: var(--patina); } .m-contraste { --c: var(--alarme); } .m-native { --c: var(--muted); }
  .t-work { --t: var(--brasa); } .t-wait { --t: var(--indigo); } .t-done { --t: var(--patina); } .t-idle { --t: var(--dim); }
  .t-fail, .t-lost, .t-dead, .t-alarm, .t-sponsor { --t: var(--alarme); }

  header.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s5); align-items: center; padding: var(--s3) var(--s5); border-bottom: 1px solid var(--rule); }
  .brand { font: 800 22px/1 var(--hud); letter-spacing: .12em; text-transform: uppercase; }
  .brand small { font: 500 12px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: var(--s3); }
  .goal { min-width: 0; font: 600 20px/1.2 var(--hud); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .goal small { display: block; font: 400 12px var(--mono); color: var(--muted); margin-top: 2px; }
  .runstate { display: flex; align-items: center; gap: var(--s4); }
  .runstate .word { font: 800 22px/1 var(--hud); text-transform: uppercase; letter-spacing: .04em; color: var(--t); padding: 6px 10px; border: 1px solid var(--t); }
  .runstate .word.loud { background: var(--alarme); color: #1A0B09; border-color: var(--alarme); }
  .runstate .sponsor { font: 700 14px/1 var(--hud); text-transform: uppercase; letter-spacing: .08em; color: var(--alarme); }
  .demo { background: var(--ambar); color: #1A1508; font-weight: 600; padding: 6px 12px; }

  /* ---- stage ---- */
  .stage { position: relative; }
  .scene { display: block; width: 100%; height: auto; }
  body.noscene .scene { display: none; }
  .hud { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s2); padding: 0 var(--s5); margin-top: -96px; position: relative; }
  body.noscene .hud { margin-top: var(--s4); }
  .st { background: var(--panel); border: 1px solid var(--rule); border-top: 3px solid var(--c); padding: var(--s3) var(--s3) var(--s3); min-height: 250px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 6px; position: relative; min-width: 0; }
  .st.loud { border: 2px solid var(--alarme); background: #24110E; }
  .st.dead, .st.lost { border: 2px dashed var(--alarme); }
  .st.idle { opacity: .72; }
  .st .nm { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); }
  .st .nm b { font: 700 20px/1 var(--hud); letter-spacing: .04em; text-transform: uppercase; color: var(--c); }
  .st .nm span { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.25; }
  .st .word { font: 800 30px/1 var(--hud); text-transform: uppercase; letter-spacing: .02em; color: var(--t); margin-top: 2px; overflow-wrap: anywhere; }
  .st.loud .word { background: var(--alarme); color: #1A0B09; padding: 4px 8px; justify-self: start; }
  .st.dead .word { text-decoration: line-through; text-decoration-thickness: 3px; }
  .st .since { font-size: 12px; color: var(--muted); }
  .st .since b { color: var(--ink); font-weight: 600; }
  .alive { font-size: 12px; display: inline-flex; align-items: center; gap: 7px; }
  .alive::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--patina); flex: none; }
  .alive.quiet { color: var(--ambar); font-weight: 600; border: 1px solid var(--ambar); padding: 3px 8px; justify-self: start; } .alive.quiet::before { background: var(--ambar); }
  .alive.silent { color: var(--alarme); font-weight: 600; } .alive.silent::before { background: var(--alarme); }
  .alive.none { display: none; }
  .inst { border-top: 1px solid var(--rule-soft); padding-top: 6px; margin-top: 2px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; min-width: 0; }
  .inst .task { font: 600 15px/1.2 var(--hud); letter-spacing: .01em; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .inst .task .id { font: 600 11px/1 var(--mono); color: var(--bg); background: var(--ink); padding: 2px 5px; flex: none; }
  .inst .task .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inst .ist { font: 700 12px/1 var(--hud); letter-spacing: .06em; text-transform: uppercase; color: var(--t); }
  .inst .ist.loud { background: var(--alarme); color: #1A0B09; padding: 2px 5px; justify-self: start; }
  .inst .detail { font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
  .inst .detail.v-REJECT { color: var(--alarme); font-weight: 600; } .inst .detail.v-DONE, .inst .detail.v-APPROVE { color: var(--patina); font-weight: 600; }
  .inst .model { font-size: 11px; color: var(--dim); }
  .inst .model b { color: var(--muted); font-weight: 500; }

  /* ---- deck under the stage ---- */
  .deck { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--s5); padding: var(--s5); }
  .label { font: 700 13px/1 var(--hud); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 var(--s3); display: flex; gap: var(--s3); align-items: baseline; }
  .label .n { font: 400 11px var(--mono); color: var(--dim); letter-spacing: 0; text-transform: none; }
  .queue .label { color: var(--alarme); }
  .q { border: 1px solid var(--alarme); border-left-width: 8px; padding: var(--s3) var(--s4); margin-bottom: var(--s2); background: #1A0F0D; }
  .q .k { display: flex; justify-content: space-between; font: 700 12px/1 var(--hud); letter-spacing: .1em; text-transform: uppercase; color: var(--alarme); }
  .q .k span:last-child { color: var(--muted); font: 400 11px var(--mono); letter-spacing: 0; text-transform: none; }
  .q .t { font: 600 17px/1.25 var(--hud); margin: 6px 0; }
  .q .d { font-size: 12px; color: var(--muted); } .q .d b { color: var(--ink); font-weight: 500; }
  .q .who { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .none { color: var(--dim); font-size: 12px; padding: var(--s2) 0; border-top: 1px solid var(--rule-soft); }
  .tl .e { display: grid; grid-template-columns: 40px 10px minmax(0, 1fr); gap: var(--s2); padding: 4px 0; border-top: 1px solid var(--rule-soft); font-size: 12px; align-items: baseline; }
  .tl .e .t { color: var(--dim); } .tl .e i { width: 8px; height: 8px; background: var(--t); display: inline-block; margin-top: 3px; }
  .tl .e .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ledger .r { display: grid; grid-template-columns: 40px 62px minmax(0, 1fr); gap: var(--s2); padding: 6px 0; border-top: 1px solid var(--rule-soft); font-size: 12px; align-items: baseline; }
  .ledger .r .t { color: var(--dim); }
  .ledger .r .v { font: 700 12px/1 var(--hud); letter-spacing: .08em; padding: 3px 6px; text-align: center; }
  .ledger .r .v.REJECT { background: var(--alarme); color: #1A0B09; } .ledger .r .v.APPROVE { background: var(--patina); color: #0B1A14; }
  .ledger .r .x small { display: block; color: var(--muted); }
  .tasks .r { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: var(--s2); padding: 6px 0; border-top: 1px solid var(--rule-soft); font-size: 12px; align-items: baseline; }
  .tasks .r b { font-weight: 600; } .tasks .r small { display: block; color: var(--muted); }
  .tasks .r .s { font: 700 11px/1 var(--hud); letter-spacing: .08em; text-transform: uppercase; color: var(--t); }
  .native { margin: 0 var(--s5) var(--s5); border: 1px dashed var(--rule); padding: var(--s3) var(--s4); display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--s5); color: var(--muted); font-size: 12px; }
  .native .row { display: grid; grid-template-columns: 130px 130px minmax(0, 1fr) auto; gap: var(--s3); }
  .native .row b { color: var(--ink); } .native .row .s { color: var(--t); font: 700 12px/1.4 var(--hud); letter-spacing: .06em; text-transform: uppercase; }
  .legend { margin: 0 var(--s5) var(--s6); display: flex; flex-wrap: wrap; gap: var(--s2); }
  .legend span { font: 700 13px/1 var(--hud); letter-spacing: .06em; text-transform: uppercase; color: var(--t); padding: 6px 8px; border: 1px solid var(--rule); }
  .legend span.loud { background: var(--alarme); color: #1A0B09; border-color: var(--alarme); }
  .legend span.dead { text-decoration: line-through; text-decoration-thickness: 2px; border: 1px dashed var(--alarme); }
  .legend span.lost { border: 1px dashed var(--alarme); }
  .legend span.quiet { color: var(--ambar); border-color: var(--ambar); }

  /* scene motion: only when the viewer allows motion; still frames otherwise */
  @media (prefers-reduced-motion: no-preference) {
    .ember { animation: rise 2.4s linear infinite; }
    .ember:nth-child(2) { animation-delay: -.6s; } .ember:nth-child(3) { animation-delay: -1.2s; } .ember:nth-child(4) { animation-delay: -1.8s; } .ember:nth-child(5) { animation-delay: -.3s; } .ember:nth-child(6) { animation-delay: -1.5s; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
    .glow-work { animation: breathe 1.6s ease-in-out infinite; } .glow-wait { animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .55; } }
    .flare { animation: flare .9s ease-in-out infinite; } @keyframes flare { 50% { opacity: .35; } }
  }

  @media (max-width: 900px) {
    header.top { grid-template-columns: minmax(0, 1fr) auto; gap: 6px var(--s3); padding: var(--s3) var(--s4); align-items: center; }
    .goal { grid-column: 1 / -1; white-space: normal; font-size: 15px; } .goal small { display: none; }
    .brand { font-size: 18px; } .brand small { display: none; }
    .runstate { gap: var(--s2); } .runstate .word { font-size: 14px; padding: 5px 8px; } .runstate .sponsor { font-size: 12px; }
    .scene text { display: none; }
    .hud { grid-template-columns: minmax(0, 1fr); margin-top: -8px; padding: 0 var(--s4); }
    .st { min-height: 0; gap: 4px; padding: var(--s3); }
    .st .word { font-size: 24px; }
    .deck { grid-template-columns: minmax(0, 1fr); padding: var(--s4); gap: var(--s5); }
    .native { margin: 0 var(--s4) var(--s4); grid-template-columns: minmax(0, 1fr); gap: var(--s2); }
    .native .row { grid-template-columns: minmax(0, 1fr) auto; } .native .row .tk, .native .row .md { grid-column: 1 / -1; }
    .legend { margin: 0 var(--s4) var(--s5); }
  }
</style>
</head>
<body>
<div id="app"><p style="color:var(--muted);padding:24px">a carregar o instantâneo…</p></div>
<script type="module">
import * as F from './crew-shared.js';
const { esc, ago, dur, clock, toneOf, LOUD } = F;

const HEX = { ferreiro: '#FF7A2F', bigorna: '#CFA063', fundidor: '#93A0FF', lapidador: '#63C9A9', contraste: '#FF4F3E' };
const ALARM = '#FF4F3E', AMBER = '#F0B23F', GREY = '#7A7069';
const W = 1440, H = 312, BASE = 214;

// One station: hearth glow + anvil + stump + name plate; overlays by tone.
function station(c, i, n, run, now) {
  const cx = 24 + ((W - 48) / n) * (i + .5);
  const tone = toneOf(c.state);
  const col = HEX[c.key] || GREY;
  const glowCol = tone === 'idle' ? GREY : ['alarm', 'sponsor', 'lost', 'dead', 'fail'].includes(tone) ? ALARM : col;
  const glowOp = { work: .95, wait: .6, done: .5, idle: .14, fail: .3, lost: .2, dead: 0, alarm: .9, sponsor: .9 }[tone] ?? .3;
  const anvilOp = ['idle', 'dead', 'lost', 'fail'].includes(tone) ? .45 : 1;
  const quiet = tone === 'work' && c.quiet > 0;
  const g = `g${i}`;
  const embers = tone === 'work' ? [0, 1, 2, 3, 4, 5].map(k => `<circle class="ember" cx="${cx - 34 + k * 14 + (k % 2 ? 6 : 0)}" cy="${BASE - 46 - (k * 11) % 40}" r="${k % 3 ? 2.2 : 3}" fill="${col}" opacity="${.85 - (k % 3) * .2}"/>`).join('') : '';
  const flare = ['alarm', 'sponsor'].includes(tone) ? `<ellipse class="flare" cx="${cx}" cy="${BASE - 10}" rx="200" ry="120" fill="url(#flare)"/><ellipse cx="${cx}" cy="${BASE + 14}" rx="150" ry="34" fill="none" stroke="${ALARM}" stroke-width="3"/><g fill="${ALARM}">${[0, 1, 2, 3, 4, 5, 6].map(k => { const x = cx - 84 + k * 24; return `<polygon points="${x + 5},${BASE + 44} ${x + 17},${BASE + 44} ${x + 12},${BASE + 52} ${x},${BASE + 52}"/>`; }).join('')}</g>` : '';
  const dashed = tone === 'lost' ? `<ellipse cx="${cx}" cy="${BASE + 14}" rx="150" ry="34" fill="none" stroke="${ALARM}" stroke-width="3" stroke-dasharray="12 10"/>` : '';
  const cross = tone === 'dead' ? `<g stroke="${ALARM}" stroke-width="9" stroke-linecap="round"><line x1="${cx - 70}" y1="${BASE - 90}" x2="${cx + 70}" y2="${BASE + 30}"/><line x1="${cx + 70}" y1="${BASE - 90}" x2="${cx - 70}" y2="${BASE + 30}"/></g>` : '';
  const quietRing = quiet ? `<ellipse cx="${cx}" cy="${BASE + 14}" rx="150" ry="34" fill="none" stroke="${AMBER}" stroke-width="3" stroke-dasharray="4 8"/>` : '';
  const hot = tone === 'work' ? `<rect x="${cx - 26}" y="${BASE - 46}" width="64" height="5" fill="${col}" opacity=".9"/>` : '';
  return `<g class="station t-${tone}" aria-label="${esc(c.name)}: ${esc(c.state)}">
    <defs><radialGradient id="${g}" cx="50%" cy="60%" r="50%"><stop offset="0" stop-color="${glowCol}" stop-opacity=".95"/><stop offset=".45" stop-color="${glowCol}" stop-opacity=".35"/><stop offset="1" stop-color="${glowCol}" stop-opacity="0"/></radialGradient></defs>
    <ellipse class="glow-${tone}" cx="${cx}" cy="${BASE - 20}" rx="170" ry="120" fill="url(#${g})" opacity="${glowOp}"/>
    <ellipse cx="${cx}" cy="${BASE + 36}" rx="180" ry="22" fill="${glowCol}" opacity="${glowOp * .16}"/>
    ${flare}${dashed}${quietRing}
    <g opacity="${anvilOp}">
      <rect x="${cx - 30}" y="${BASE + 4}" width="60" height="42" fill="#1A1412" stroke="#332A24"/>
      <rect x="${cx - 22}" y="${BASE - 8}" width="44" height="12" fill="#2A2321"/>
      <rect x="${cx - 14}" y="${BASE - 26}" width="28" height="18" fill="#332B28"/>
      <polygon points="${cx - 62},${BASE - 34} ${cx - 26},${BASE - 46} ${cx - 26},${BASE - 26} ${cx - 54},${BASE - 26}" fill="#3B322E"/>
      <rect x="${cx - 26}" y="${BASE - 46}" width="64" height="20" fill="#3E3531" stroke="#4A403B"/>
      ${hot}
    </g>
    ${embers}${cross}
    <text x="${cx}" y="${BASE + 66}" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="${tone === 'idle' ? GREY : col}">${esc(c.name.toUpperCase())}</text>
  </g>`;
}

function scene(run, now) {
  const n = run.roster.length;
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Cena da forja: uma estação por membro; a luz de cada estação mostra o estado (o texto exato está no HUD por baixo)">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E0C0B"/><stop offset="1" stop-color="#1A1513"/></linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211B18"/><stop offset="1" stop-color="#0F0D0C"/></linearGradient>
      <radialGradient id="flare" cx="50%" cy="60%" r="50%"><stop offset="0" stop-color="${ALARM}" stop-opacity=".9"/><stop offset=".5" stop-color="${ALARM}" stop-opacity=".3"/><stop offset="1" stop-color="${ALARM}" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="${W}" height="${BASE + 8}" fill="url(#wall)"/>
    <polygon points="0,${BASE + 8} ${W},${BASE + 8} ${W},${H} 0,${H}" fill="url(#floor)"/>
    <line x1="0" y1="${BASE + 8}" x2="${W}" y2="${BASE + 8}" stroke="#3A2F28" stroke-width="1"/>
    <line x1="0" y1="${BASE + 48}" x2="${W}" y2="${BASE + 48}" stroke="#2A221D" stroke-width="1"/>
    ${run.roster.map((c, i) => station(c, i, n, run, now)).join('')}
  </svg>`;
}

function sliceTask(i, run) { const s = F.splitTask(i.task); const id = i.taskId || s.id; return { id, title: (id && F.taskTitle(run, id)) || s.title || i.task || '—' }; }

function instRow(i, run, now) {
  const { id, title } = sliceTask(i, run); const tone = toneOf(i.state); const v = i.handback?.status || i.verdict;
  const detail = i.permission ? `permissão pendente — ${i.permission.tool}: ${i.permission.message}` : (i.progress?.text || i.detail || i.lastAction || (v ? `entregou ${v}` : ''));
  return `<div class="inst t-${tone}"><div class="task">${id ? `<span class="id">${esc(id)}</span>` : ''}<span class="title" title="${esc(i.task)}">${esc(title)}</span></div>
    <div class="ist ${LOUD.has(i.state) ? 'loud' : ''}">${esc(i.state)} · ${ago(now, i.since)}</div>
    <div class="detail ${v ? 'v-' + esc(v) : ''}">${esc(detail)}</div>
    <div class="model">modelo <b>${esc(i.resolvedModel || '—')}</b> · começou ${clock(i.startedAt)}${i.calls ? ` · ${i.calls} chamadas` : ''}</div></div>`;
}

function panel(c, run, now) {
  const tone = toneOf(c.state); const live = F.liveness(c, run, now);
  const cls = ['st', 'm-' + c.key, 't-' + tone, LOUD.has(c.state) ? 'loud' : '', tone === 'dead' ? 'dead' : '', tone === 'lost' ? 'lost' : '', tone === 'idle' ? 'idle' : ''].join(' ');
  let body;
  if (c.key === 'ferreiro') body = `<div class="inst t-${tone}"><div class="task"><span class="id">run</span><span class="title" title="${esc(run.goal)}">${esc(run.goal || 'sem objetivo')}</span></div><div class="ist t-${toneOf(run.status)} ${LOUD.has(run.status) ? 'loud' : ''}">run ${esc(run.status)}</div><div class="detail">${esc(c.detail || c.lastAction || '')}</div><div class="model">modelo <b>da sessão · mínimo ${esc(run.modelFloor || '—')}</b> · ${c.calls ?? 0} chamadas</div></div>`;
  else if (!c.instances?.length) body = `<div class="inst t-idle"><div class="task"><span class="title">sem instância neste run</span></div><div class="detail">ainda não foi chamado</div></div>`;
  else body = c.instances.map(i => instRow(i, run, now)).join('');
  return `<section class="${cls}" aria-label="${esc(c.name)}: ${esc(c.state)}">
    <div class="nm"><b>${esc(c.name)}</b><span>${esc(c.role.split(' — ')[0])}</span></div>
    <div class="word">${esc(c.state)}</div>
    <div class="since">${c.since ? `<b>${ago(now, c.since)}</b> · desde ${clock(c.since)}` : 'sem instância neste run'}</div>
    <div class="alive ${live.kind}">${esc(live.text)}</div>
    ${body}</section>`;
}

function queue(items, now) {
  if (!items.length) return `<div class="none">Nada pendente para o Sponsor.</div>`;
  return items.map(q => `<div class="q"><div class="k"><span>${esc(q.kind)}${q.id ? ' ' + esc(q.id) : ''}</span><span>${ago(now, q.since)} · ${clock(q.since)}</span></div><div class="t">${esc(q.title)}</div>${q.fallback ? `<div class="d"><b>se não responder:</b> ${esc(q.fallback)}</div>` : ''}${q.why ? `<div class="d"><b>porquê:</b> ${esc(q.why)}</div>` : ''}<div class="who">pedido por ${esc(q.who)}${q.task ? ' · ' + esc(q.task) : ''}</div></div>`).join('');
}

const { run, now, demo, src, scene: showScene } = await F.loadSnapshot();
if (!showScene) document.body.classList.add('noscene');
const q = F.sponsorQueue(run, now); const rt = toneOf(run.status);
const label = Object.fromEntries(F.KANBAN); const ttone = { todo: 'idle', doing: 'work', review: 'wait', done: 'done', failed: 'fail', blocked: 'alarm' };
const rs = F.reviews(run);
document.getElementById('app').innerHTML = `
