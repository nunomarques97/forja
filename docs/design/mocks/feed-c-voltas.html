<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed de eventos — direção C: Voltas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="feed-base.css">
<style>
/* DIREÇÃO C — «VOLTAS»
   Os quatro eventos de uma delegação (chamou · começou · terminou · voltou)
   são UMA linha, não quatro: uma «volta». Assinatura: a RÉGUA de quatro
   passos dentro de cada volta — passo feito é cheio com a hora, passo que
   ainda não aconteceu é tracejado e diz o que se espera (evento 5, no sítio
   onde vai acontecer). Veredito, escalada e relatório são marcos largos entre
   as voltas. À direita, a coluna «Precisa de ti / Agora» por projeto.
   MOCK — não é produção. */
.grelha{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:1fr 360px;gap:var(--s6);padding:var(--s5)}
h2{font:800 15px/1 var(--hud);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 var(--s3)}
.diaT{font:800 13px/1 var(--hud);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:var(--s5) 0 var(--s2)}

.volta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2) var(--s4);align-items:center;
       padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);margin-bottom:var(--s2)}
.volta .quem{font:700 18px/1.1 var(--hud);letter-spacing:.02em;display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.volta .quem .seta{color:var(--dim)}
.volta .quem .proj{margin-left:var(--s2)}
.volta .txt{color:var(--dim);font-size:14px;overflow-wrap:anywhere}
.volta .res{text-align:right}
.volta .res .d{color:var(--dim);font-size:13px;margin-top:4px}
.regua{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.passo{position:relative;padding-top:14px;font-size:13px;color:var(--dim)}
.passo::before{content:"";position:absolute;top:4px;left:0;right:0;height:2px;background:var(--c,var(--line))}
.passo::after{content:"";position:absolute;top:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--c,var(--line))}
.passo b{display:block;color:var(--ink);font-weight:500}
.passo.feito{--c:var(--neutro)}
.passo.feito.vivo{--c:var(--vivo)}
.passo.falta::before{background:repeating-linear-gradient(90deg,var(--espera) 0 5px,transparent 5px 10px)}
.passo.falta::after{background:var(--bg);border:2px solid var(--espera);box-sizing:border-box}
.passo.falta b{color:var(--espera)}
.passo.caiu::before{background:repeating-linear-gradient(90deg,var(--parado) 0 5px,transparent 5px 10px)}
.passo.caiu::after{background:var(--parado);border-radius:1px}
.passo.caiu b{color:var(--parado)}

.marco{display:grid;grid-template-columns:24px 1fr auto;gap:var(--s3);align-items:start;margin:var(--s3) 0;
       padding:var(--s3) var(--s4);border-left:4px solid var(--c);background:var(--surface-2);border-radius:var(--r-chip)}
.marco .tit{font:700 20px/1.1 var(--hud);display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.marco .txt{margin-top:4px;opacity:.86;overflow-wrap:anywhere}
.marco .extra{color:var(--dim);font-size:13px;margin-top:4px}
.marco .dir{text-align:right}

.lado{position:sticky;top:var(--s4);align-self:start;display:grid;gap:var(--s3)}
.cp{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--r-card);padding:var(--s3) var(--s4)}
.cp .l1{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.cp .nome{font:800 20px/1 var(--hud)}
.cp .pl{display:flex;gap:var(--s2);margin-top:var(--s3);font-size:14px}
.cp .pl b{display:block;font-weight:600}
.cp .pl .t{color:var(--dim)}
.cp.curto{border-top-width:1px;border-left:4px solid var(--c);padding:var(--s2) var(--s4)}
.cp.curto .q{color:var(--dim);font-size:13px}

@media (max-width:980px){
  .grelha{grid-template-columns:1fr;padding:var(--s4);gap:var(--s4)}
  .lado{position:static;order:-1}
  .volta{grid-template-columns:1fr}
  .volta .res{text-align:left;display:flex;gap:var(--s2);align-items:center}
  .volta .res .d{margin:0}
  .regua{grid-template-columns:repeat(2,1fr);row-gap:var(--s2)}
  .marco{grid-template-columns:20px 1fr}
  .marco .dir{grid-column:2;text-align:left}
}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">FORJA<span>quem chamou quem, e o que saiu daí</span></div>
  <div class="nota" id="nota"></div>
</header>
<div class="grelha">
  <main><h2>Voltas e marcos</h2><div id="voltas"></div></main>
  <aside class="lado" id="lado"></aside>
</div>
<script src="feed-dados.js"></script>
<script src="feed-comum.js"></script>
<script>
const { F, hora, dia, ha, dura, esc, G, frase, pendente, projetosVisiveis } = FEEDUI;
document.getElementById('nota').textContent = `Instantâneo real de ${dia(F.agora)}, ${hora(F.agora)} · últimas ${F.horas} h`;
const parados = new Set(F.pendentes.filter(p => p.tipo === 'parado').map(p => p.projeto));

// Agrupar: tudo o que tem o mesmo agente é uma volta; o resto são marcos.
const cron = [...F.eventos].reverse();
const voltas = new Map(); const itens = [];
for (const e of cron) {
  if (e.id && ['chamada', 'inicio', 'fim', 'regresso', 'veredito'].includes(e.tipo)) {
    let v = voltas.get(e.id);
    if (!v) { v = { tipo: 'volta', projeto: e.projeto, ts: e.ts, passos: {} }; voltas.set(e.id, v); itens.push(v); }
    v.passos[e.tipo === 'veredito' ? 'fim' : e.tipo] = e;
    if (e.tipo === 'veredito') v.veredito = e;
    v.ult = e.ts;
  } else if (e.tipo === 'veredito' && e.fonte === 'run') {
    // O veredito que o runner regista pertence à última volta do Reviewer neste projeto.
    const v = [...itens].reverse().find(x => x.tipo === 'volta' && x.projeto === e.projeto && (x.passos.chamada?.para || x.passos.inicio?.papel) === e.papel);
    if (v && !v.veredito) { v.veredito = e; continue; }
    itens.push({ tipo: 'marco', e });
  } else if (!['chamada', 'inicio', 'fim', 'regresso'].includes(e.tipo) || e.sessao) itens.push({ tipo: 'marco', e });
}
itens.sort((a, b) => b.ts?.localeCompare?.(a.ts) ?? 0);
for (const i of itens) if (i.tipo === 'marco') i.ts = i.e.ts;
itens.sort((a, b) => b.ts.localeCompare(a.ts));

function volta(v) {
  const p = v.passos, quem = p.chamada?.para || p.inicio?.papel || p.fim?.papel || p.regresso?.de;
  const de = p.chamada?.de || 'Lead';
  const texto = p.chamada?.texto || p.inicio?.texto || '';
  const aberta = !p.regresso;
  const caiu = aberta && parados.has(v.projeto);
  const passo = (ev, nome, espera, vivo) => ev
    ? `<div class="passo feito${vivo ? ' vivo' : ''}"><b>${nome}</b>${hora(ev.ts)}</div>`
    : `<div class="passo ${caiu ? 'caiu' : 'falta'}"><b>${caiu ? 'não chegou' : espera}</b>${caiu ? 'o runner saiu' : 'ainda não'}</div>`;
  const ok = v.veredito && /APPROVE/.test(v.veredito.veredito);
  const res = v.veredito
    ? `<span class="selo b-${ok ? 'ok' : 'parado'}">${ok ? 'APROVADO' : 'REJEITADO'}</span>`
    : p.fim ? `<span class="selo b-${/BLOCKED|FAILED/.test(p.fim.estado) ? 'espera' : 'neutro'}">${/BLOCKED/.test(p.fim.estado) ? 'BLOQUEADO' : /FAILED/.test(p.fim.estado) ? 'NÃO CONSEGUIU' : 'ENTREGOU'}</span>`
    : `<span class="selo b-${caiu ? 'parado' : 'vivo'}">${caiu ? 'INTERROMPIDA' : 'A TRABALHAR'}</span>`;
  const d = p.inicio && (p.fim || p.regresso) ? `demorou ${dura(p.inicio.ts, (p.fim || p.regresso).ts)}` : p.inicio ? `começou ${ha(p.inicio.ts)}` : '';
  const porque = v.veredito?.texto ? `<div class="txt">${esc(v.veredito.texto)}</div>` : '';
  return `<article class="volta"><div><div class="quem">${esc(de)} <span class="seta">→</span> ${esc(quem)} <span class="proj">${esc(v.projeto)}</span></div>${texto ? `<div class="txt">${esc(texto)}</div>` : ''}${porque}</div>`
    + `<div class="res">${res}<div class="d">${d}</div></div>`
    + `<div class="regua">${passo(p.chamada, 'Chamou', 'chamar', false)}${passo(p.inicio, 'Começou', 'à espera de começar', !p.fim && !caiu)}${passo(p.fim, 'Terminou', `à espera que ${quem} termine`)}${passo(p.regresso, `Voltou ao ${de}`, `à espera que o ${de} retome`)}</div></article>`;
}
function marco(e) {
  const x = frase(e);
  return `<div class="marco b-${x.banda}"><span class="g">${G[x.glifo]}</span><div><div class="tit">${esc(x.titulo)}${x.selo ? ` <span class="selo">${x.selo}</span>` : ''}</div>${x.texto ? `<div class="txt">${esc(x.texto)}</div>` : ''}${x.extra ? `<div class="extra">${esc(x.extra)}</div>` : ''}</div><div class="dir"><div class="hora">${hora(e.ts)}</div><div class="proj">${esc(e.projeto)}</div></div></div>`;
}
let ultDia = '', html = [];
for (const i of itens.slice(0, 70)) {
  const d = dia(i.ts); if (d !== ultDia) { html.push(`<div class="diaT">${d}</div>`); ultDia = d; }
  html.push(i.tipo === 'volta' ? volta(i) : marco(i.e));
}
document.getElementById('voltas').innerHTML = html.join('');

document.getElementById('lado').innerHTML = '<h2>Agora</h2>' + projetosVisiveis.map(p => {
  const pend = F.pendentes.filter(x => x.projeto === p.nome).map(pendente);
  if (!pend.length) return `<div class="cp curto b-${p.estado.banda}"><div class="l1"><span class="nome">${esc(p.nome)}</span><span class="q">${esc(p.estado.palavra.toLowerCase())} ${esc(p.estado.quando || '')}</span></div></div>`;
  return `<div class="cp b-${p.estado.banda}"><div class="l1"><span class="nome">${esc(p.nome)}</span><span class="selo">${p.estado.palavra}</span></div>${pend.map(x => `<div class="pl b-${x.banda}"><span class="g">${G[x.glifo]}</span><div><b>${esc(x.titulo)}</b><span class="t">${esc(x.texto || x.quando)}</span></div></div>`).join('')}</div>`;
}).join('');
</script>
</body>
</html>
