<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed de eventos — direção A: Fio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="feed-base.css">
<style>
/* DIREÇÃO A — «FIO»
   Um único fio cronológico com TODOS os projetos misturados, o mais recente
   em cima. Por cima do fio, a faixa «Agora» diz o que está para acontecer em
   cada projeto (o evento 5). Assinatura: a ESPINHA — a linha vertical do fio,
   onde os eventos importantes (veredito, escalada, relatório) cortam a linha
   com uma barra larga na sua cor e os de passagem (chamar, começar, terminar,
   voltar) ficam pequenos e baços. MOCK — não é produção. */
main{max-width:1040px;margin:0 auto;padding:var(--s5) var(--s5) var(--s7)}
h2{font:800 15px/1 var(--hud);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 var(--s3)}

.agora{display:grid;gap:var(--s2);margin-bottom:var(--s6)}
.ag{display:grid;grid-template-columns:150px 150px 1fr;gap:var(--s4);align-items:start;background:var(--surface);
    border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r-card);padding:var(--s3) var(--s4)}
.ag .nome{font:800 22px/1.05 var(--hud);letter-spacing:.02em}
.ag .pend{display:grid;gap:var(--s2)}
.pl{display:flex;gap:var(--s2);align-items:flex-start}
.pl b{font-weight:600}
.pl .q{color:var(--dim);font-size:13px}
.pl .t{color:var(--dim)}
.ag .calmo{color:var(--dim)}
.ag.curto{padding:var(--s2) var(--s4);align-items:center}
.ag.curto .nome{font-size:18px}

.filtros{display:flex;gap:var(--s2);flex-wrap:wrap;margin:0 0 var(--s4)}
.f{border:1px solid var(--line);background:none;color:var(--ink);border-radius:var(--r-pill);padding:7px 14px 6px;
   font:600 14px/1 var(--hud);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.f[aria-pressed=true]{background:var(--ink);color:var(--escuro);border-color:var(--ink)}

.fio{position:relative;padding-left:0}
.diaT{font:800 14px/1 var(--hud);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:var(--s5) 0 var(--s2) 76px}
.ev{display:grid;grid-template-columns:52px 24px 1fr auto;gap:0 var(--s3);align-items:start;position:relative;padding:5px 0}
.ev::before{content:"";position:absolute;left:75px;top:0;bottom:0;width:2px;background:var(--line)}
.ev .g{margin-top:1px;position:relative;z-index:1;background:var(--bg);box-shadow:0 0 0 3px var(--bg)}
.ev .hora{padding-top:3px;text-align:right}
.ev .tit{font-weight:500}
.ev .txt{color:var(--dim);font-size:14px;overflow-wrap:anywhere}
.ev.leve .tit{color:var(--dim);font-weight:400}
.ev.leve{padding:3px 0}
.ev.imp{margin:var(--s2) 0}
.ev.imp .corpo{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r-card);padding:var(--s3) var(--s4)}
.ev.imp .tit{font:700 20px/1.1 var(--hud);letter-spacing:.02em;display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.ev.imp .txt{color:var(--ink);opacity:.86;margin-top:6px;font-size:15px}
.ev.imp .extra{color:var(--dim);font-size:13px;margin-top:6px}
.ev .proj{padding-top:4px}
.so-imp .ev.leve{display:none}

@media (max-width:720px){
  main{padding:var(--s4) var(--s4) var(--s7)}
  .ag{grid-template-columns:1fr;gap:var(--s2)}
  .ag .cab{display:flex;justify-content:space-between;align-items:center}
  .ag.curto{grid-template-columns:auto auto 1fr;gap:var(--s3)}
  .ag.curto .calmo{font-size:13px;text-align:right}
  .ev{grid-template-columns:40px 20px 1fr;gap:0 var(--s2)}
  .ev::before{left:59px}
  .ev .proj{grid-column:3;padding-top:2px;order:-1}
  .diaT{margin-left:60px}
  .ev.imp .tit{font-size:18px}
}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">FORJA<span>o que aconteceu, em todos os projetos</span></div>
  <div class="nota" id="nota"></div>
</header>
<main>
  <h2>Agora</h2>
  <section class="agora" id="agora"></section>
  <h2>O que aconteceu</h2>
  <div class="filtros" id="filtros"></div>
  <section class="fio" id="fio"></section>
</main>
<script src="feed-dados.js"></script>
<script src="feed-comum.js"></script>
<script>
const { F, hora, dia, ha, esc, G, frase, pendente, projetosVisiveis } = FEEDUI;
document.getElementById('nota').textContent = `Instantâneo real de ${dia(F.agora)}, ${hora(F.agora)} · últimas ${F.horas} h`;

document.getElementById('agora').innerHTML = projetosVisiveis.map(p => {
  const pend = F.pendentes.filter(x => x.projeto === p.nome).map(pendente);
  const linhas = pend.length ? pend.map(x => `<div class="pl b-${x.banda}"><span class="g">${G[x.glifo]}</span><div><b>${esc(x.titulo)}</b>${x.texto ? ` <span class="t">— ${esc(x.texto)}</span>` : ''}<div class="q">${esc(x.quando)}</div></div></div>`).join('')
    : `<div class="calmo">${p.estado.quando ? 'Terminou ' + esc(p.estado.quando) : 'Nada à espera'}</div>`;
  return `<article class="ag b-${p.estado.banda}${pend.length ? '' : ' curto'}"><div class="cab"><div class="nome">${esc(p.nome)}</div></div><div><span class="selo">${p.estado.palavra}</span></div><div class="pend">${linhas}</div></article>`;
}).join('');

let proj = null, soImp = false;
function filtros() {
  const b = (id, lbl, on) => `<button class="f" data-f="${id}" aria-pressed="${on}">${lbl}</button>`;
  document.getElementById('filtros').innerHTML = b('tudo', 'Todos os projetos', !proj)
    + projetosVisiveis.map(p => b(p.nome, p.nome, proj === p.nome)).join('')
    + b('imp', soImp ? 'Mostrar tudo' : 'Só o que importa', soImp);
}
document.getElementById('filtros').onclick = ev => {
  const f = ev.target.closest('[data-f]')?.dataset.f; if (!f) return;
  if (f === 'imp') soImp = !soImp; else proj = f === 'tudo' ? null : f;
  desenha();
};
function desenha() {
  filtros();
  let ultDia = '';
  const html = [];
  for (const e of F.eventos) {
    if (proj && e.projeto !== proj) continue;
    const x = frase(e); if (!x) continue;
    const d = dia(e.ts); if (d !== ultDia) { html.push(`<div class="diaT">${d}</div>`); ultDia = d; }
    html.push(x.importante
      ? `<div class="ev imp b-${x.banda}"><span class="hora">${hora(e.ts)}</span><span class="g">${G[x.glifo]}</span><div class="corpo"><div class="tit">${esc(x.titulo)} ${x.selo ? `<span class="selo">${x.selo}</span>` : ''}</div>${x.texto ? `<div class="txt">${esc(x.texto)}</div>` : ''}${x.extra ? `<div class="extra">${esc(x.extra)}</div>` : ''}</div><span class="proj">${esc(e.projeto)}</span></div>`
      : `<div class="ev leve b-${x.banda}"><span class="hora">${hora(e.ts)}</span><span class="g">${G[x.glifo]}</span><div><span class="tit">${esc(x.titulo)}</span>${x.texto ? ` <span class="txt">· ${esc(x.texto)}</span>` : ''}</div><span class="proj">${esc(e.projeto)}</span></div>`);
    if (html.length > 260) break;
  }
  const fio = document.getElementById('fio');
  fio.innerHTML = html.join('');
  fio.classList.toggle('so-imp', soImp);
}
desenha();
</script>
</body>
</html>
