<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sample-project</title>
  <style>
    :root {
      --bg: #14171c;
      --text: #e6e8eb;
      --muted: #a3aab4;
      --accent: #6fb3f2;
      --line: #2a2f37;
      --s-1: 0.25rem;
      --s-2: 0.5rem;
      --s-3: 1rem;
      --s-4: 1.5rem;
      --s-5: 2.5rem;
      --s-6: 4rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
    }
    body {
      margin: 0;
      font-size: 1.125rem;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    main {
      max-width: 40rem;
      margin-inline: auto;
      padding-block: var(--s-6);
      padding-inline: var(--s-4);
    }
    h1 {
      margin: 0 0 var(--s-3);
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.2;
    }
    p { margin: 0; }
    img, pre { max-width: 100%; }
    a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.15em;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      main { padding-block: var(--s-5); }
    }
  </style>
</head>
<body>
  <main>
    <h1>sample-project</h1>
    <p>A deliberately tiny, dependency-free Node project that exists so Forja can validate its bootstrap on something real.</p>
  </main>
</body>
</html>
